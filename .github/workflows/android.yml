name: Build Android APK

# Builds installable APKs on GitHub's machines, so nobody needs the Android
# SDK locally. Each app's APK is attached to the run as a downloadable artifact.
on:
  push:
    branches: [main, dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  # Lets you build on demand from the Actions tab, choosing which app and where
  # it should point without editing the file.
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: false
        type: choice
        default: both
        options:
          - both
          - customer
          - restaurant
      apiUrl:
        # Blank is the normal case. A pre-filled default would always win over
        # the repository setting and quietly build against the wrong address.
        description: 'API base URL (blank uses the EXPO_PUBLIC_API_URL variable or secret)'
        required: false
        default: ''

concurrency:
  # A newer push makes an in-flight build pointless.
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Compiling the new architecture's C++ for four ABIs is the slow part.
    timeout-minutes: 60

    strategy:
      # One app failing should not cancel the other's build.
      fail-fast: false
      matrix:
        app: >-
          ${{ fromJSON(github.event.inputs.app == 'customer' && '["customer"]'
          || github.event.inputs.app == 'restaurant' && '["restaurant"]'
          || '["customer","restaurant"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json

      # React Native 0.86 needs JDK 17; newer JDKs are not reliably supported
      # by the Gradle plugin.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK whose licences are
      # accepted. android-actions/setup-android replaced its command-line tools
      # with a version that then failed to re-accept them, and it installs no
      # NDK in any case. Using what is already on the machine and adding only
      # the missing pieces avoids both problems.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Already accepted in the image; this covers anything newly added.
          # `yes` closes the pipe first, so a non-zero status here means
          # nothing - a genuinely unaccepted licence fails the install below.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # New architecture builds compile C++, so the NDK and CMake are not
          # optional. These versions are the ones React Native 0.86 pins in
          # gradle/libs.versions.toml, matching a known-good local build.
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Install dependencies
        run: npm ci
        working-directory: mobile/${{ matrix.app }}

      - name: Resolve the API URL
        id: api
        run: |
          # The address is never hard-coded here. A manual run can type one;
          # otherwise it comes from repository settings. Both tabs are read,
          # because "variable" and "secret" are an easy pair to mix up and the
          # difference does not matter for an address that ships inside the
          # APK anyway.
          URL="${{ github.event.inputs.apiUrl }}"
          if [ -z "$URL" ]; then URL="${{ vars.EXPO_PUBLIC_API_URL }}"; fi
          if [ -z "$URL" ]; then URL="${{ secrets.EXPO_PUBLIC_API_URL }}"; fi
          if [ -z "$URL" ]; then
            echo "::error::No API URL. Add EXPO_PUBLIC_API_URL under Settings > Secrets and variables > Actions (either tab), or run this workflow manually and type one in the box."
            exit 1
          fi

          # A pasted address often carries a trailing slash, which would make
          # every request path start with a double slash.
          URL="${URL%/}"

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Shown as *** if it came from the secrets tab; that is GitHub
          # masking it, not an empty value.
          echo "Building against $URL"

          # The address is compiled into the APK and cannot be changed
          # afterwards, so an unreachable one means forty minutes of work for
          # an app that cannot talk to anything. Better to stop here.
          if ! curl -fsS -m 25 -o /dev/null "$URL/health"; then
            echo "::error::$URL/health did not respond. If this is a Cloudflare tunnel, check it is still running on your machine - the address changes every restart. Update the EXPO_PUBLIC_API_URL setting, or type the current address into the box when starting this run."
            exit 1
          fi
          echo "The API answered. Good to build."

      - name: Generate the native project
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.api.outputs.url }}
        run: npx expo prebuild --platform android --clean
        working-directory: mobile/${{ matrix.app }}

      - name: Build the release APK
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.api.outputs.url }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/${{ matrix.app }}/android

      - name: Name the APK after the commit
        id: rename
        run: |
          NAME="foodos-${{ matrix.app }}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"
        working-directory: mobile/${{ matrix.app }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: foodos-${{ matrix.app }}-apk
          path: mobile/${{ matrix.app }}/${{ steps.rename.outputs.name }}
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Foodos ${{ matrix.app }} APK"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo "- **API:** ${{ steps.api.outputs.url }}"
            echo ""
            echo "Download **foodos-${{ matrix.app }}-apk** from the **Artifacts** section at the bottom of this page."
            echo ""
            echo "> Signed with Android's debug key: fine for testing, not for the Play Store."
          } >> "$GITHUB_STEP_SUMMARY"
