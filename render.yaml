# Render blueprint for Foodos: the API, and the admin panel website.
#
# One API serves every app: the customer, restaurant and delivery apps and the
# admin panel all talk to it.
#
# The database is not declared here: Neon's free tier keeps data when the
# service sleeps, which Render's free Postgres deletes after 30 days. Paste
# Neon's DIRECT connection string (connection pooling turned off) into
# DATABASE_URL when the service is created.

services:
  - type: web
    name: foodos-api
    runtime: docker
    plan: free
    # Closest Render region to India. Create the Neon project in Singapore
    # (aws ap-southeast-1) too, so every query is not a round trip abroad.
    region: singapore
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render restarts the container if this stops answering.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # staging: real secrets and strict settings, like production, but login
      # codes may be shown on screen. Switch to production once the client's
      # DLT registration is approved and MSG91 is connected.
      - key: NODE_ENV
        value: staging

      # While no SMS provider is connected, the login code is returned to the
      # app and shown on screen, so testers can sign in. Anyone who knows a
      # phone number can therefore sign in as it: keep test data only on this
      # deployment until SMS is live. Ignored when NODE_ENV=production.
      - key: EXPOSE_OTP_IN_RESPONSE
        value: "true"

      # Neon's direct connection string. Set in the dashboard, never in the repo.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and kept across deploys. Rotating either of
      # these signs everyone out, which is fine on a first deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

      # Test keys for now; swap for live keys before taking real money.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Razorpay generates this when the webhook is pointed at this service.
      # Leave it empty on the first deploy and add it afterwards.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Websites allowed to call the API from a browser: the admin panel.
      # The mobile apps send no Origin header and are unaffected. (Local
      # development allows localhost by itself, so it is not listed here.)
      - key: CORS_ORIGINS
        value: https://foodos-admin.onrender.com

  # The admin panel: a static website, free on Render and never asleep (only
  # the API sleeps). Rebuilt only when something under admin/ changes.
  - type: web
    name: foodos-admin
    runtime: static
    branch: dev
    buildCommand: cd admin && npm ci && npm run build
    staticPublishPath: ./admin/dist
    autoDeploy: true
    buildFilter:
      paths:
        - admin/**
    envVars:
      # Baked into the build: where the panel finds the API.
      - key: VITE_API_URL
        value: https://foodos-api-x6mc.onrender.com
    routes:
      # Every page address (/orders/123, /riders...) is served the app, which
      # then shows the right screen.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Only this site's own code may run, and it may only talk to the API and
      # the map tiles. This is what keeps the stored sign-in safe from an
      # injected script.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://foodos-api-x6mc.onrender.com https://tiles.openfreemap.org; connect-src 'self' https://foodos-api-x6mc.onrender.com https://tiles.openfreemap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      # File names carry a content hash, so they can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
