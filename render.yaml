# Render blueprint for the Foodos API.
#
# One service serves both apps: the customer app and the restaurant partner app
# talk to the same API.
#
# The database is not declared here: Neon's free tier keeps data when the
# service sleeps, which Render's free Postgres deletes after 30 days. Paste
# Neon's DIRECT connection string (connection pooling turned off) into
# DATABASE_URL when the service is created.

services:
  - type: web
    name: foodos-api
    runtime: docker
    plan: free
    # Closest Render region to India. Create the Neon project in Singapore
    # (aws ap-southeast-1) too, so every query is not a round trip abroad.
    region: singapore
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render restarts the container if this stops answering.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # staging: real secrets and strict settings, like production, but login
      # codes may be shown on screen. Switch to production once the client's
      # DLT registration is approved and MSG91 is connected.
      - key: NODE_ENV
        value: staging

      # While no SMS provider is connected, the login code is returned to the
      # app and shown on screen, so testers can sign in. Anyone who knows a
      # phone number can therefore sign in as it: keep test data only on this
      # deployment until SMS is live. Ignored when NODE_ENV=production.
      - key: EXPOSE_OTP_IN_RESPONSE
        value: "true"

      # Neon's direct connection string. Set in the dashboard, never in the repo.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and kept across deploys. Rotating either of
      # these signs everyone out, which is fine on a first deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

      # Test keys for now; swap for live keys before taking real money.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Razorpay generates this when the webhook is pointed at this service.
      # Leave it empty on the first deploy and add it afterwards.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Only the browser frontend needs this; the mobile apps do not send
      # Origin headers and are unaffected.
      - key: CORS_ORIGINS
        value: http://localhost:5173
